<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        .post {
    width: 500px;
    margin: 300px auto;
    padding: 30px;
    background: white;
    color: black;
    border-radius: 15px;
    font-size: 20px;

    position: relative;

    opacity: 0.45;
    filter: brightness(0.55);

    --pfx-scale: 1;

    transform: scale(var(--pfx-scale));

    transition:
        transform 0.18s ease-out,
        filter 0.18s ease-out,
        opacity 0.18s ease-out;
}

.post.fx-active {
    transform: scale(1.2) !important;
    z-index: 10;

    opacity: 1;
    filter: brightness(1);

    box-shadow:
        0 0 10px #ff00ff,
        0 0 25px #00ffff,
        0 0 45px #ffff00;
}

.post.fx-active::before {
    content: "";

    position: absolute;
    inset: -4px;

    border-radius: inherit;
    padding: 4px;

    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    background-size: 400% 100%;

    animation: rainbowBorder 2s linear infinite;

    pointer-events: none;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;
}

@keyframes rainbowBorder {
    to {
        background-position: 400% 0;
    }
}

#pfx-flash {
    position: fixed;
    inset: 0;

    background: white;

    pointer-events: none;

    z-index: 2147483647;

    opacity: 0;
}

#pfx-flash.active {
    animation: pfxFlash 0.18s ease-out;
}

@keyframes pfxFlash {
    0% {
        opacity: 0.65;
    }

    100% {
        opacity: 0;
    }
}

/* ===== POST FX STUDIO UI ===== */

body {
    background:
        radial-gradient(circle at 20% 10%, #25203d 0, transparent 35%),
        radial-gradient(circle at 80% 90%, #102b35 0, transparent 35%),
        #08090d;

    color: #f5f5f7;
}

main {

    padding: 40px 24px;
}

h1 {

}

main > p {
    color: #777;

}

    gap: 24px;
}

.box {
    background: rgba(20,20,29,.82);
    border: 1px solid #30303d;
    box-shadow:

    backdrop-filter: blur(18px);
}

.box h3 {
    font-size: 13px;
    letter-spacing: 1px;

}

.box hr {

}

label {
    color: #ccc;
}

input[type="checkbox"] {
    accent-color: #8b5cff;
}

input[type="range"] {

}

select,
textarea {
    background: #0c0d12;

}

button {
    background: linear-gradient(
        135deg,
        #7c4dff,

        0 8px 25px #7c4dff33;

    transition: .15s;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.15);
}

.preview {
    min-height: 650px;

    background:
        radial-gradient(
            circle,
            #20202c 0,
            #09090d 65%

    border: 1px solid #292936;

    box-shadow:

}

.preview::before {
    content: "LIVE PREVIEW";

    position: absolute;

    top: 18px;
    left: 22px;

    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
}

<script>

document.getElementById("generateBookmarklet").onclick = () => {

    const bookmarklet = `javascript:(()=>{

        const style = document.createElement("style");

        style.textContent = \`
            article[data-testid="tweet"].__postfx {
                position: relative !important;
                z-index: 999999 !important;

                border-radius: 18px !important;

                inset: -5px;

                border-radius: 20px;
                padding: 4px;

                background: linear-gradient(
                    90deg,
                    red,
                    orange,
                    yellow,
                    lime,
                    cyan,
                    blue,
                    violet,
                    red
                );

                background-size: 400% 100%;

                animation: postfxRainbow 2s linear infinite;

                pointer-events: none;

                -webkit-mask:
                    linear-gradient(#000 0 0) content-box,
                    linear-gradient(#000 0 0);

                -webkit-mask-composite: xor;
                mask-composite: exclude;
            }

            @keyframes postfxRainbow {

        document.head.appendChild(style);

        let lastPost = null;

        function updatePostFX() {

            const posts =
                document.querySelectorAll(
                    'article[data-testid="tweet"]'
                );

            const centerY =
                window.innerHeight / 2;

            let closest = null;
            let closestDistance = Infinity;

            posts.forEach(post => {

                const rect =
                    post.getBoundingClientRect();

                const postCenter =
                    rect.top + rect.height / 2;

                const distance =
                    Math.abs(postCenter - centerY);

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closest = post;
                }

            });

            if (
                closest &&
                closestDistance < 100 &&
                closest !== lastPost
            ) {

                if (lastPost) {
                    lastPost.classList.remove("__postfx");
                }

                closest.classList.add("__postfx");

                lastPost = closest;

                console.log(

<script>

let currentSEs = [];
let lastSEPair = [];

function playRandomSE() {

    const selected =
        [...document.querySelectorAll(".se-select:checked")];

    // SEが2個未満なら何もしない
    if (selected.length < 2) return;

    // 前のSEを全部停止
    currentSEs.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });

    currentSEs = [];

    let first;
    let second;

    // 前回と同じ組み合わせにならないようにする
    do {

        first =
            Math.floor(Math.random() * selected.length);

        do {
            second =
                Math.floor(Math.random() * selected.length);
        } while (second === first);

    } while (
        lastSEPair.includes(first) &&
        lastSEPair.includes(second)
    );

    lastSEPair = [first, second];

    // 2つ同時再生
    [first, second].forEach(index => {

        const audio =
            new Audio(selected[index].value);

        audio.volume = 0.7;

        currentSEs.push(audio);

        audio.play().catch(() => {});

    });
}

let lastCenterPost = null;


function triggerFlash() {

    const flash =
        document.getElementById("pfx-flash");

    if (!flash) return;

    flash.classList.remove("active");

    // アニメーションをリセット
    void flash.offsetWidth;

    flash.classList.add("active");

    setTimeout(() => {
        flash.classList.remove("active");
    }, 220);
}


function updateFX() {

    const posts =
    document.querySelectorAll('article[data-testid="tweet"]');

    const centerY =
        window.innerHeight / 2;


    let closestPost = null;

    let closestDistance = Infinity;


    posts.forEach(post => {

        const rect =
            post.getBoundingClientRect();

        const postCenter =
            rect.top + rect.height / 2;


        const distance =
            Math.abs(postCenter - centerY);


        // 0 = 中央
        // 1 = 遠い
        const progress =
            Math.min(distance / 500, 1);


        // 1.00 ～ 1.20倍
        const scale =
            1.2 - progress * 0.2;


        if (distance < closestDistance) {

            closestDistance = distance;

            closestPost = post;

        }

    });


    // 中央ポストを決定

    if (
        closestPost &&
        closestDistance < 100 &&
        closestPost !== lastCenterPost
    ) {

        // 前のポストを解除

        if (lastCenterPost) {

            lastCenterPost.classList.remove(
                "fx-active"
            );

        }


        // 新しいポストを主役に

        closestPost.classList.add(
         "fx-active"
        );

        closestPost.style.transform =
         "scale(1.05)";

        lastCenterPost =
         closestPost;

        playRandomSE();

        triggerFlash();


        console.log(
            "中央ポスト:",
            closestPost
        );

    }


    requestAnimationFrame(updateFX);

}


requestAnimationFrame(updateFX);

</script>
